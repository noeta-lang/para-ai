name: CI

# The para/ai package's CI: check + test the package itself and every example with a pinned
# released `noeta`. This package is pure Noeta, so there is no Rust job — but `para/api` ships a
# native extension crate, so the first `noeta check` composes a toolchain (a cargo build) and the
# later ones reuse the cached binary. That is why a Rust toolchain and a cargo cache are set up
# here even though this repo contains no Rust.
#
# `para/api` resolves from the registry (`{ version = "^0.2", package = "para/api" }`), so nothing
# here checks it out: `noeta` fetches the release the lockfile pins. Checking it out as a sibling is
# what this workflow used to do, and it could not work on a runner — `actions/checkout` will not
# write outside `$GITHUB_WORKSPACE`, which is where a `../para-api` sibling would have to go.

on:
  push:
    branches: [main]
  pull_request:
  # Callable as the release gate (release.yml runs the full CI before publishing).
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pinned in lockstep with the toolchain repo's own CI (dtolnay/rust-toolchain@1.97.0 there): the
# NOETA_VERSION resolves from the org-level Actions variable of the same name (single bump point
# for every para repo), falling back to the literal. Bumping is deliberate — raise it here and in
# `release.yml` together.
env:
  CARGO_TERM_COLOR: always
  NOETA_VERSION: ${{ vars.NOETA_VERSION || 'v0.2.3' }}

jobs:
  package:
    name: Package (noeta check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Install noeta ${{ env.NOETA_VERSION }}
        run: |
          DIST="noeta-${NOETA_VERSION}-x86_64-unknown-linux-gnu"
          curl -fsSL "https://github.com/noeta-lang/noeta/releases/download/${NOETA_VERSION}/${DIST}.tar.gz" | tar -xz
          echo "${PWD}/${DIST}" >> "$GITHUB_PATH"
      - name: noeta check + test the package
        run: |
          for f in *.noe; do
            echo "== ${f}"
            noeta check "$f"
            noeta test "$f"
          done
      - name: noeta check + test every example
        run: |
          for ex in examples/*/; do
            echo "== ${ex}"
            for f in "${ex}"*.noe; do
              (cd "${ex}" && noeta check "$(basename "$f")" && noeta test "$(basename "$f")")
            done
          done

  # The one job that talks to a real model.
  #
  # Every other provider in this package needs a paid key, so real end-to-end coverage would land in
  # the "nice to have, never runs" bucket. Ollama needs none — which is why DESIGN §2.1 calls it the
  # provider that makes CI honest, and why `examples/providers` carries two live checks alongside its
  # hermetic ones.
  #
  # `OLLAMA_REQUIRED=1` is what makes this job worth having. Without it the live checks skip when
  # nothing is listening, and `noeta test` captures a passing test's stdout — so a job whose server
  # failed to start would report ten green tests and prove nothing. With it, an unreachable Ollama is
  # a failure naming the host it tried.
  #
  # `qwen3:0.6b` is chosen for its size (~500 MB): large enough to answer and small enough to pull on
  # every run. Nothing here asserts on *what* the model says — only that a request this package
  # encoded is one a real server accepts, buffered and streamed, which is the part no fixture can
  # prove.
  local-ollama:
    name: Live Ollama (no secret, end to end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Install noeta ${{ env.NOETA_VERSION }}
        run: |
          DIST="noeta-${NOETA_VERSION}-x86_64-unknown-linux-gnu"
          curl -fsSL "https://github.com/noeta-lang/noeta/releases/download/${NOETA_VERSION}/${DIST}.tar.gz" | tar -xz
          echo "${PWD}/${DIST}" >> "$GITHUB_PATH"
      - name: Start Ollama and pull a small model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          # The server is up when it answers, not when the process exists.
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:11434/api/tags >/dev/null 2>&1 && break
            sleep 1
          done
          ollama pull "${OLLAMA_MODEL}"
        env:
          OLLAMA_MODEL: qwen3:0.6b
      - name: noeta test the providers example against the live server
        run: cd examples/providers && noeta test main.noe
        env:
          OLLAMA_MODEL: qwen3:0.6b
          # Turn a skipped live check into a failure. This is the whole point of the job.
          OLLAMA_REQUIRED: "1"
